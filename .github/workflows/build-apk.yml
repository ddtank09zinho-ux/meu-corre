name: Gerar app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: |
          npm install --no-audit --no-fund
          pip install pillow

      - name: Montar projeto Android
        run: |
          node scripts/copy-web.js
          npx cap add android
          python3 scripts/customize-android.py
          node scripts/copy-web.js
          npx cap sync android

      - name: Assinatura de teste
        run: |
          if [ ! -f keystore/meu-corre-teste.jks.b64 ]; then
            mkdir -p keystore
            keytool -genkeypair -keystore /tmp/k.jks -alias meucorre -keyalg RSA -keysize 2048 -validity 10000 -storepass meucorre-teste -keypass meucorre-teste -dname "CN=Meu Corre Beta, O=Meu Corre, C=BR"
            base64 -w 76 /tmp/k.jks > keystore/meu-corre-teste.jks.b64
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add keystore/meu-corre-teste.jks.b64
            git commit -m "Assinatura de teste do beta [skip ci]"
            git push
          fi

      - name: Compilar APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: meucorre-teste
        run: |
          base64 -d ../keystore/meu-corre-teste.jks.b64 > app/release.jks
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Nomear APK
        run: |
          echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV
          cp android/app/build/outputs/apk/release/app-release.apk meu-corre.apk

      - uses: actions/upload-artifact@v4
        with:
          name: meu-corre-apk
          path: meu-corre.apk

      - name: Publicar versão para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-${{ github.run_number }}
          name: Sobra Real ${{ env.VERSION }} (build ${{ github.run_number }})
          body: |
            Baixe o arquivo **meu-corre.apk** abaixo no celular Android e instale.
          files: meu-corre.apk
          make_latest: true

      - name: Versão da Play Store (.aab)
        env:
          CHAVE_B64: ${{ secrets.MEUCORRE_CHAVE }}
          KEYSTORE_PASSWORD: ${{ secrets.MEUCORRE_SENHA }}
        run: |
          if [ -z "$CHAVE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "Chave da Play Store ainda não cadastrada: o arquivo .aab não foi gerado."
            exit 0
          fi
          LOJA=1 node scripts/copy-web.js
          npx cap copy android
          # Lê a chave e a senha tolerando espaços, quebras de linha e texto colado junto (nada é exibido)
          python3 - <<'PY'
          import os, re, base64, hashlib
          txt = os.environ['CHAVE_B64']
          # junta as linhas seguidas que só têm caracteres de base64 e fica com o maior bloco
          blocos, atual = [], []
          for linha in txt.replace('\r', '').split('\n'):
              l = linha.strip()
              if len(l) >= 16 and re.fullmatch(r'[A-Za-z0-9+/=]+', l):
                  atual.append(l)
              elif atual:
                  blocos.append(''.join(atual)); atual = []
          if atual: blocos.append(''.join(atual))
          b64 = max(blocos, key=len) if blocos else ''
          try:
              dados = base64.b64decode(b64 + '=' * (-len(b64) % 4))
          except Exception as e:
              dados = b''
              print('Chave: o texto colado em MEUCORRE_CHAVE não é uma chave válida.')
          open('android/app/release.jks', 'wb').write(dados)
          print(f'Chave: {len(dados)} bytes, impressão digital {hashlib.sha256(dados).hexdigest()[:12]}')
          senha = os.environ['KEYSTORE_PASSWORD'].strip()
          print(f'Senha: {len(senha)} caracteres (espaços e quebras de linha das pontas removidos)')
          PY
          export KEYSTORE_PASSWORD="$(printf '%s' "$KEYSTORE_PASSWORD" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if keytool -list -keystore android/app/release.jks -storepass "$KEYSTORE_PASSWORD" > /tmp/kl.txt 2>&1; then
            echo "Senha da chave: confere"
          else
            echo "Senha da chave: NÃO confere com a chave ($(head -1 /tmp/kl.txt | cut -c1-80))"
            exit 1
          fi
          export KEY_ALIAS=$(grep -i PrivateKeyEntry /tmp/kl.txt | head -1 | cut -d, -f1)
          echo "Chave da loja: alias $KEY_ALIAS"
          cd android
          ./gradlew bundleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab ../meu-corre-loja.aab
          echo "AAB=1" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        if: env.AAB == '1'
        with:
          name: meu-corre-play-store
          path: meu-corre-loja.aab
